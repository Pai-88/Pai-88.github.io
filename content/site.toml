# ───────────────────────────── Selected work ─────────────────────────────

[[project]]
id = "pallorhb"
tier = "featured"
name = "PallorHb"
what = "Anaemia screening from photographs of the eyelid, and an audit of the benchmark it is tested on"
evidence = "real"
status = "Preprint on Zenodo, September 2026. Sole author."
checked = 2026-09-29
layout = "wide"
summary = "I set out to estimate haemoglobin from conjunctiva photographs on the public CP-AnemiC dataset. Its 710 published records turned out to be 383 distinct photographs. The copies cross hospitals and carry conflicting haemoglobin values, so grouping folds by site, the standard safeguard, still left two-fifths of the inflation in place."
tools = "Python, scikit-learn, NumPy, SciPy"

  [[project.fact]]
  label = "Distinct photographs"
  value = "**383** of 710 records"
  [[project.fact]]
  label = "Inflation from a naive split"
  value = "**+0.176** AUROC (95% CI +0.120 to +0.232)"
  [[project.fact]]
  label = "Corrected baseline"
  value = "AUROC **0.706** (95% CI 0.653 to 0.757)"
  [[project.fact]]
  label = "What the image adds"
  value = "**+0.182** AUROC over demographics alone (DeLong p = 2 × 10⁻⁶)"
  [[project.fact]]
  label = "Limit"
  value = "A triage screen, not a haemoglobin meter: Bland-Altman limits of agreement span 7.8 g/dL"
  [[project.fact]]
  label = "Reproducibility"
  value = "62 tests. Every number in the manuscript is regenerated and checked by script."

  [[project.link]]
  label = "Read the preprint"
  href = "https://doi.org/10.5281/zenodo.22782147"
  [[project.link]]
  label = "Code and duplicate detector"
  href = "https://github.com/Pai-88/pallor-hb"

  [[project.figure]]
  src = "assets/img/pallorhb_pair.webp"
  kind = "plate"
  alt = "Figure from the preprint: the same conjunctiva photograph filed as Image_143 at one hospital with haemoglobin 12.5 g/dL and as Image_165 at another with 12.8 g/dL, beside the near-zero difference between them after a 3 pixel shift"
  caption = "One photograph filed under two identifiers, at two hospitals, with two haemoglobin values. The third panel is the difference after a 3 pixel shift. Images: CP-AnemiC dataset (Asare, Mendeley Data), CC BY 4.0."



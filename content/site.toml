[[project]]
id = "wavelab"
tier = "featured"
name = "Wave Lab"
what = "A real-time harmonic analyser that runs in the browser"
evidence = "real"
status = "Live at paingheinhtet.com since June 2026. Demo mode needs no microphone."
checked = 2026-10-01
layout = "wide"
summary = "A single-page instrument that takes the microphone signal and shows what it is made of while it plays: each dominant frequency drawn as its own travelling sine wave with its note name, the spectrum with its peaks marked, the raw waveform, an X-Y phase scope, and the detected sines re-summed and laid over the real wave. The analysis runs on an 8,192-point FFT in the Web Audio API; the overlay uses a direct DFT at each detected frequency, so amplitude and phase are exact rather than read off a bin. Low-, high- and band-pass filters apply live, with optional monitoring. A YAMNet classifier runs in the browser through TensorFlow.js and names the sound among 521 classes; song recognition goes through the AudD API with the user's own token, which never leaves the browser."
tools = "JavaScript, Web Audio API, Canvas, TensorFlow.js"

  [[project.fact]]
  label = "Analysis frame"
  value = "**8,192**-point FFT: 5.9 Hz per bin and 171 ms of audio per frame at 48 kHz, smoothing 0.78"
  [[project.fact]]
  label = "Decomposition"
  value = "The strongest peaks (**5** by default, adjustable) each traced as a travelling sine; phase and amplitude from a direct DFT at the detected frequency"
  [[project.fact]]
  label = "Measurements"
  value = "Level and peak in dB, fundamental with note name, period, wavelength in air at 343 m/s, spectral centroid, zero-crossing rate, harmonics H1 to H8"
  [[project.fact]]
  label = "Filters"
  value = "Low-, high- and band-pass biquad stages with a live cutoff; Q 0.7, band-pass Q 4"
  [[project.fact]]
  label = "Classifier"

[[project]]
id = "eit"
tier = "featured"
name = "EIT-16CH"
what = "A 16-electrode electrical impedance tomography instrument, and how to reconstruct images from it"
evidence = "sim"
status = "Simulation only. Boards designed, nothing powered yet."
checked = 2026-09-29
layout = "wide"
summary = "EIT images a cross-section from voltages measured at the surface. It is the method used at the bedside to watch a lung inflate. My first learned reconstruction, trained on clean simulations, lost to the classical Gauss-Newton solver as soon as noise was added. Trained with the noise model the instrument will actually have, a small U-Net beat it at every noise level tested."
tools = "KiCad, ESP32-S3, PlatformIO, PyTorch, NumPy, pyEIT"

  [[project.fact]]
  label = "At 20 dB"
  value = "Correlation with the truth **0.566**, against 0.170 for Gauss-Newton"
  [[project.fact]]
  label = "Clean data"
  value = "0.825 against 0.791"
  [[project.fact]]
  label = "Uncertainty"
  value = "Five-member ensemble: the confident half of each image is **8 to 18 times** more accurate than the doubtful half"
  [[project.fact]]
  label = "Hardware"
  value = "A 4-layer 100 x 100 mm board with 104 footprints, and a 2-layer through-hole version for hand assembly. Neither is fabricated."
  [[project.fact]]
  label = "Next"
  value = "Measure the real signal-to-noise ratio in a saline tank and test the simulation-trained model against it"

  [[project.figure]]
  src = "assets/img/eit_recon.webp"
  kind = "plate"
  alt = "Grid of reconstructions: ground truth, classical Gauss-Newton and the learned method, on clean data and at 30 dB and 20 dB of noise. The classical images break up as noise rises; the learned ones keep both inclusions."
  caption = "Ground truth, Gauss-Newton and the U-Net at three noise levels. Simulated data."
  [[project.figure]]
  src = "assets/img/board_eit16.webp"
  kind = "render"
  alt = "Render of the EIT-16CH measurement board: a square board with multiplexers, amplifiers and an ESP32-S3 module"
  caption = "The 4-layer board. KiCad render."



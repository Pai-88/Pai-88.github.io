# ─────────────────────────────── Publication ─────────────────────────────

[[publication]]
authors = "Htet, P. H."
year = "2026"
title = "Duplicate leakage in a public conjunctival pallor benchmark, and an honest baseline for image-based anaemia screening"
venue = "Preprint, Zenodo"
doi = "10.5281/zenodo.22782147"
note = "Shows that a published clinical image dataset contains far fewer distinct images than records, that the duplicates carry conflicting labels, and that the usual site-grouped cross-validation does not remove the resulting inflation. Reports a corrected baseline and releases the detector."


